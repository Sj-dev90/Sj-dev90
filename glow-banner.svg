<svg width="900" height="140" viewBox="0 0 900 140" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39ff88">
        <animate attributeName="stop-color"
          values="#39ff88;#00e5ff;#39ff88" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#00e5ff">
        <animate attributeName="stop-color"
          values="#00e5ff;#39ff88;#00e5ff" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#39ff88">
        <animate attributeName="stop-color"
          values="#39ff88;#00e5ff;#39ff88" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulse {
        0%   { opacity: 0.65; }
        50%  { opacity: 1; }
        100% { opacity: 0.65; }
      }
      .glow-text {
        font-family: 'Courier New', 'DejaVu Sans Mono', monospace;
        font-weight: bold;
        font-size: 52px;
        fill: url(#glowGrad);
        filter: url(#softGlow);
        animation: pulse 2.4s ease-in-out infinite;
      }
      .cursor {
        animation: pulse 1s steps(1) infinite;
        fill: #39ff88;
      }
    </style>
  </defs>

  <rect width="900" height="140" fill="transparent" />
  <text x="50%" y="65" text-anchor="middle" class="glow-text">⚡ SIDDHARTH JAIN</text>
  <text x="50%" y="105" text-anchor="middle"
        font-family="'Courier New', monospace" font-size="18" fill="#8be9a8">
    solving complex problems... or at least brute-forcing them elegantly<tspan class="cursor">_</tspan>
  </text>
</svg>
